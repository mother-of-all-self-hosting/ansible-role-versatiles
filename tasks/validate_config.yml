---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "versatiles_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required VersaTiles settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - { "name": "versatiles_uid", when: true }
    - { "name": "versatiles_gid", when: true }
    - { "name": "versatiles_hostname", when: true }
    - { "name": "versatiles_path_prefix", when: true }
    - { "name": "versatiles_container_network", when: true }
    - { "name": "versatiles_container_labels_traefik_middleware_basic_auth_users", when: "{{ versatiles_container_labels_traefik_middleware_basic_auth_enabled }}" }
    - { "name": "versatiles_built_tile_data_url", when: true }

- name: Run if Traefik is enabled
  when: versatiles_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for VersaTiles are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - versatiles_container_labels_traefik_hostname
        - versatiles_container_labels_traefik_path_prefix

    - name: Fail if versatiles_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          versatiles_container_labels_traefik_path_prefix (`{{ versatiles_container_labels_traefik_path_prefix }}`) must be `/`.
          VersaTiles does not support hosting under a subpath yet.
      when: "versatiles_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `versatiles_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if versatiles_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          versatiles_container_labels_traefik_path_prefix (`{{ versatiles_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/versatiles`).
      when: "versatiles_container_labels_traefik_path_prefix != '/' and versatiles_container_labels_traefik_path_prefix[-1] == '/'"
