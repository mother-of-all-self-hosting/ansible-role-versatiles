---
- name: Ensure VersaTiles paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ versatiles_uid }}"
    group: "{{ versatiles_gid }}"
  with_items:
    - "{{ versatiles_base_path }}"
    - "{{ versatiles_data_path }}"

- name: Ensure VersaTiles support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ versatiles_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ versatiles_uid }}"
    group: "{{ versatiles_gid }}"
  with_items:
    - env
    - labels
  register: versatiles_support_files_result

- name: Ensure VersaTiles built tile data file downloaded
  ansible.builtin.include_tasks: download.yml
  when: versatiles_built_tile_data_download_auto | bool
  register: versatiles_built_tile_data_file_result

- name: Ensure VersaTiles container image is pulled via community.docker.docker_image
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image:
    name: "{{ versatiles_container_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
    force_source: "{{ versatiles_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
    force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else versatiles_container_image_force_pull }}"
  register: versatiles_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: versatiles_container_image_pull_result is not failed

- name: Ensure VersaTiles container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ versatiles_container_image }}"
  register: versatiles_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: versatiles_container_image_pull_result is not failed
  changed_when: "'Downloaded newer image' in versatiles_container_image_pull_result.stdout"

- name: Ensure VersaTiles container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ versatiles_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: versatiles_network_creation_result

- name: Ensure VersaTiles container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ versatiles_container_network }}
  register: versatiles_network_creation_result
  changed_when: versatiles_network_creation_result.rc == 0
  failed_when: versatiles_network_creation_result.rc != 0 and 'already exists' not in versatiles_network_creation_result.stderr

- name: Ensure VersaTiles systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/versatiles.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ versatiles_identifier }}.service"
    mode: "0644"
  register: versatiles_systemd_service_result

- name: Determine whether VersaTiles needs a restart
  ansible.builtin.set_fact:
    versatiles_restart_necessary: >-
      {{
        versatiles_support_files_result.changed | default(false)
        or versatiles_built_tile_data_file_result.changed | default(false)
        or versatiles_systemd_service_result.changed | default(false)
        or versatiles_container_image_pull_result.changed | default(false)
      }}
