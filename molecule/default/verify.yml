---
- name: Verify VersaTiles systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for VersaTiles service to become active (up to 180s)
      ansible.builtin.systemd:
        name: versatiles.service
      register: versatiles_service
      until: versatiles_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert VersaTiles service is active
      ansible.builtin.assert:
        that: versatiles_service.status.ActiveState == 'active'
        fail_msg: "versatiles.service not active ({{ versatiles_service.status.ActiveState }})"
        success_msg: "versatiles.service is active"

    - name: Retrieve VersaTiles service log for debugging
      when: versatiles_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu versatiles.service
      changed_when: false

    - name: Wait for VersaTiles HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8080/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: versatiles_endpoint
      until: versatiles_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert VersaTiles HTTP endpoint responds
      ansible.builtin.assert:
        that: versatiles_endpoint.status in [200, 302]
        fail_msg: "VersaTiles did not respond as expected ({{ versatiles_endpoint.status | default('no response') }})"
        success_msg: "VersaTiles responded with {{ versatiles_endpoint.status }}"

    - name: Show VersaTiles systemd service status summary
      ansible.builtin.debug:
        msg:
          - "VersaTiles systemd: {{ versatiles_service.status.ActiveState }}"
          - "VersaTiles HTTP: {{ versatiles_endpoint.status }}"
