---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: versatiles-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        versatiles_debug_service_enabled: false

        # The port that the container publishes on the test host, and which
        # verify.yml probes. Only defined once, so the two cannot drift apart.
        versatiles_molecule_http_bind_port: 8080

        # A pre-built VersaTiles container (about 19 MB) covering the Dresden
        # area, pinned to a release asset so that its bytes never change.
        #
        # Deliberately NOT generated by the version under test: it was written
        # by an older VersaTiles and carries the `versatiles_v02` container
        # format, so serving a tile out of it is also a check that the version
        # this scenario installs can still read containers that operators
        # already have on disk.
        versatiles_molecule_tile_data_url: https://github.com/moan0s/ansible-role-versatiles/releases/download/v0.0.1/dresden.versatiles

        # The tile that verify.yml fetches. The dataset covers a small area, so
        # only the lowest zoom levels are populated - z0/0/0 is the one tile it
        # is guaranteed to hold.
        versatiles_molecule_tile_path: /tiles/osm/0/0/0

        # A layer of the shortbread schema that the fetched tile is known to
        # carry, used to tell a real vector tile from any other payload.
        versatiles_molecule_tile_layer: boundaries

        # Variables for VersaTiles
        versatiles_uid: 1000
        versatiles_gid: 1000
        versatiles_scheme: http

        # Deliberately not `localhost`: it ends up in a Traefik router rule
        # that verify.yml reads back off the container, and a value nothing
        # else could have produced makes that check meaningful.
        versatiles_hostname: versatiles.molecule.local

        # Left enabled (unlike most scenarios) so that templates/labels.j2 and
        # the response-header computation behind it are exercised. No Traefik
        # runs here; the labels are only read back off the container.
        versatiles_container_labels_traefik_enabled: true

        versatiles_container_http_host_bind_port: "127.0.0.1:{{ versatiles_molecule_http_bind_port }}"
        versatiles_built_tile_data_url: "{{ versatiles_molecule_tile_data_url }}"

        # A timezone no image would ever default to, so that reading it back
        # out of the running process proves templates/env.j2 reached it.
        versatiles_environment_variables_tz: Pacific/Chatham
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
